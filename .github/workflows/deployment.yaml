name: SB app build and deploy

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: sb-app

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4.4.0

      - name: Setting up Java
        uses: actions/setup-java@v4.4.0
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build Jar
        run: mvn clean package -DskipTests

      - name: Building Docker Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest .

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push image to Docker Hub
        run: docker push ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest

      - name: Deploy the application to Render  #via Docker Hub as pulling the image and spinning on render
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"  # Deploy hook:- When this hook URL receives a request, Render starts a deployment.
